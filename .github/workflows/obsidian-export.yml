name: Obsidian Daily Export

# Scheduled export moved into daily-update.yml (evening run). Kept for manual backfill only.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export to Obsidian daily vault
        run: python jobs/export_to_daily_vault.py
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
