name: Daily Data Update

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC = 07:00 KST
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch indicators
        run: python jobs/fetch_indicators.py
        continue-on-error: true

      - name: Fetch economic calendar
        run: python jobs/fetch_economic_calendar.py
        continue-on-error: true

      - name: Fetch Korea stats
        run: python jobs/fetch_korea_stats.py
        continue-on-error: true

      - name: Poll RSS and Naver news
        id: poll
        run: python jobs/poll.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Verify poll output
        if: steps.poll.outcome == 'success'
        run: |
          if [ ! -f cache_candidates.json ]; then
            echo "::error::cache_candidates.json was not created by poll.py"
            exit 1
          fi
          ITEMS=$(python -c "import json; print(len(json.load(open('cache_candidates.json'))))")
          echo "cache_candidates.json contains $ITEMS items"
          if [ "$ITEMS" -eq 0 ]; then
            echo "::warning::cache_candidates.json is empty (0 items)"
          fi

      - name: Render briefing
        id: render
        if: steps.poll.outcome == 'success'
        run: python render.py

      - name: Verify render output
        if: steps.render.outcome == 'success'
        run: |
          if [ ! -f latest_briefing.json ]; then
            echo "::error::latest_briefing.json was not created"
            exit 1
          fi
          python -c "
          import json, sys
          data = json.load(open('latest_briefing.json'))
          date = data.get('date', '')
          top5 = len(data.get('top5', []))
          sections = len(data.get('sections', {}))
          print(f'Date: {date}')
          print(f'Top5 count: {top5}')
          print(f'Sections count: {sections}')
          if top5 == 0:
              print('::warning::top5 is empty')
          if sections == 0:
              print('::error::No sections in briefing')
              sys.exit(1)
          "

      - name: Generate AI briefing summary
        if: steps.render.outcome == 'success'
        run: python jobs/generate_summary.py
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_*.json cached_summary_*.json cache_candidates.json kr_bond_history.json || true
          git diff --staged --quiet || git commit -m "Daily data update $(date +'%Y-%m-%d')"
          git push
