name: Daily Data Update

on:
  schedule:
    - cron: '0 22 * * 0-5'   # 22:00 UTC = 07:00 KST next day (Mon-Sat morning)
    - cron: '50 7 * * 1-6'   # 07:50 UTC = 16:50 KST (Mon-Sat evening)
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Override run type (morning / evening). Leave blank for auto-detect.'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine run type
        id: runtype
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_TYPE_INPUT: ${{ github.event.inputs.run_type }}
        run: |
          # Classify by the triggering cron entry, not the clock — scheduled runs can start hours late
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TYPE="${RUN_TYPE_INPUT:-evening}"
            echo "Manual run: type=$TYPE"
          else
            case "$SCHEDULE" in
              '0 22 * * 0-5') TYPE=morning;  echo "Running morning (07:00 KST) update — RSS only" ;;
              '50 7 * * 1-6') TYPE=evening;  echo "Running evening (16:50 KST) update — full with OCR" ;;
              *)              TYPE=unknown;  echo "WARNING: Unrecognized trigger (event=$EVENT_NAME, schedule='$SCHEDULE') — YouTube dispatch skipped" ;;
            esac
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch Raindrop bookmarks
        run: python jobs/fetch_raindrop.py
        continue-on-error: true
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Fetch indicators
        run: python jobs/fetch_indicators.py
        continue-on-error: true
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}

      - name: Fetch economic calendar
        run: python jobs/fetch_economic_calendar.py
        continue-on-error: true

      - name: Fetch Korea stats
        run: python jobs/fetch_korea_stats.py
        continue-on-error: true

      - name: Check OCR headlines data
        if: steps.runtype.outputs.type == 'evening'
        run: |
          if [ -f jobs/data/ocr_headlines.json ]; then
            ITEMS=$(python -c "import json; d=json.load(open('jobs/data/ocr_headlines.json')); print(len(d.get('articles', [])))")
            echo "OCR headlines: $ITEMS articles"
          else
            echo "::warning::jobs/data/ocr_headlines.json not found"
          fi

      - name: Poll RSS and Naver news
        id: poll
        run: python jobs/poll.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Verify poll output
        if: steps.poll.outcome == 'success'
        run: |
          if [ ! -f cache_candidates.json ]; then
            echo "::error::cache_candidates.json was not created by poll.py"
            exit 1
          fi
          ITEMS=$(python -c "import json; print(len(json.load(open('cache_candidates.json'))))")
          echo "cache_candidates.json contains $ITEMS items"
          if [ "$ITEMS" -eq 0 ]; then
            echo "::warning::cache_candidates.json is empty (0 items)"
          fi

      - name: Render briefing
        id: render
        if: steps.poll.outcome == 'success'
        run: python jobs/render.py

      - name: Verify render output
        if: steps.render.outcome == 'success'
        run: |
          if [ ! -f latest_briefing.json ]; then
            echo "::error::latest_briefing.json was not created"
            exit 1
          fi
          RUN_TYPE="${{ steps.runtype.outputs.type }}"
          python -c "
          import json, sys
          data = json.load(open('latest_briefing.json'))
          date = data.get('date', '')
          headlines = len(data.get('headlines', []))
          sections = len(data.get('sections', {}))
          print(f'Date: {date}')
          print(f'Headlines count: {headlines}')
          print(f'Sections count: {sections}')
          run_type = '$RUN_TYPE'
          if headlines == 0 and run_type == 'evening':
              print('::warning::headlines is empty (afternoon run)')
          if sections == 0:
              print('::error::No sections in briefing')
              sys.exit(1)
          "

      - name: Generate AI briefing summary
        id: summary
        if: steps.render.outcome == 'success'
        run: |
          set -o pipefail
          python jobs/generate_summary.py 2>&1 | tee /tmp/summary_output.log
          if grep -q "EN briefing content changed" /tmp/summary_output.log; then
            echo "en_changed=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate KR Audio
        id: tts
        if: steps.render.outcome == 'success' && steps.runtype.outputs.type == 'evening'
        run: python jobs/generate_tts.py
        continue-on-error: true
        env:
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}

      - name: Add podcast episode to RSS
        if: steps.tts.outcome == 'success'
        continue-on-error: true
        run: |
          node --version
          node scripts/add-podcast-episode.cjs

      - name: Post Moltbook comment
        if: steps.render.outcome == 'success' && steps.runtype.outputs.type == 'evening'
        run: python jobs/moltbook_comment.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_*.json cached_summary_*.json cache_candidates.json kr_bond_history.json jobs/data/ client/public/audio/ client/public/feed.xml || true
          git diff --staged --quiet || git commit -m "Daily data update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

      - name: Wait for Vercel deployment
        if: steps.summary.outputs.en_changed == 'true' && steps.runtype.outputs.type == 'evening'
        run: |
          echo "Vercel 배포 완료 대기 중 (120초)..."
          sleep 120
          echo "대기 완료, YouTube pipeline 트리거"

      - name: Trigger YouTube pipeline
        if: steps.summary.outputs.en_changed == 'true' && steps.runtype.outputs.type == 'evening'
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.github.com/repos/matrixshin-ai/youtube-automation/actions/workflows/pipeline.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "YouTube pipeline dispatched successfully"
          else
            echo "::warning::YouTube pipeline dispatch failed (HTTP $HTTP_CODE)"
          fi
