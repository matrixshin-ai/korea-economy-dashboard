name: Daily Data Update

on:
  schedule:
    - cron: '0 22 * * 0-5'   # 22:00 UTC = 07:00 KST next day (Mon-Sat morning)
    - cron: '45 6 * * 1-6'   # 06:45 UTC = 15:45 KST (Mon-Sat afternoon)
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine run type
        id: runtype
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" = "22" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
            echo "Running morning (07:00 KST) update — RSS only"
          else
            echo "type=afternoon" >> $GITHUB_OUTPUT
            echo "Running afternoon (15:30 KST) update — full with OCR"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch indicators
        run: python jobs/fetch_indicators.py
        continue-on-error: true
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}

      - name: Fetch economic calendar
        run: python jobs/fetch_economic_calendar.py
        continue-on-error: true

      - name: Fetch Korea stats
        run: python jobs/fetch_korea_stats.py
        continue-on-error: true

      - name: Check OCR headlines data
        if: steps.runtype.outputs.type == 'afternoon'
        run: |
          if [ -f jobs/data/ocr_headlines.json ]; then
            ITEMS=$(python -c "import json; d=json.load(open('jobs/data/ocr_headlines.json')); print(len(d.get('articles', [])))")
            echo "OCR headlines: $ITEMS articles"
          else
            echo "::warning::jobs/data/ocr_headlines.json not found"
          fi

      - name: Poll RSS and Naver news
        id: poll
        run: python jobs/poll.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Verify poll output
        if: steps.poll.outcome == 'success'
        run: |
          if [ ! -f cache_candidates.json ]; then
            echo "::error::cache_candidates.json was not created by poll.py"
            exit 1
          fi
          ITEMS=$(python -c "import json; print(len(json.load(open('cache_candidates.json'))))")
          echo "cache_candidates.json contains $ITEMS items"
          if [ "$ITEMS" -eq 0 ]; then
            echo "::warning::cache_candidates.json is empty (0 items)"
          fi

      - name: Render briefing
        id: render
        if: steps.poll.outcome == 'success'
        run: python jobs/render.py

      - name: Verify render output
        if: steps.render.outcome == 'success'
        run: |
          if [ ! -f latest_briefing.json ]; then
            echo "::error::latest_briefing.json was not created"
            exit 1
          fi
          RUN_TYPE="${{ steps.runtype.outputs.type }}"
          python -c "
          import json, sys
          data = json.load(open('latest_briefing.json'))
          date = data.get('date', '')
          headlines = len(data.get('headlines', []))
          sections = len(data.get('sections', {}))
          print(f'Date: {date}')
          print(f'Headlines count: {headlines}')
          print(f'Sections count: {sections}')
          run_type = '$RUN_TYPE'
          if headlines == 0 and run_type == 'afternoon':
              print('::warning::headlines is empty (afternoon run)')
          if sections == 0:
              print('::error::No sections in briefing')
              sys.exit(1)
          "

      - name: Generate AI briefing summary
        id: summary
        if: steps.render.outcome == 'success'
        run: |
          set -o pipefail
          python jobs/generate_summary.py 2>&1 | tee /tmp/summary_output.log
          if grep -q "EN briefing content changed" /tmp/summary_output.log; then
            echo "en_changed=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post Moltbook comment
        if: steps.render.outcome == 'success' && steps.runtype.outputs.type == 'afternoon'
        run: python jobs/moltbook_comment.py
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_*.json cached_summary_*.json cache_candidates.json kr_bond_history.json jobs/data/ || true
          git diff --staged --quiet || git commit -m "Daily data update $(date +'%Y-%m-%d')"
          git push

      - name: Trigger YouTube pipeline
        if: steps.summary.outputs.en_changed == 'true' && steps.runtype.outputs.type == 'afternoon'
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.github.com/repos/matrixshin-ai/youtube-automation/actions/workflows/pipeline.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"main"}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "YouTube pipeline dispatched successfully"
          else
            echo "::warning::YouTube pipeline dispatch failed (HTTP $HTTP_CODE)"
          fi
